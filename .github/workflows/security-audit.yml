name: Security Audit

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  FAIL_LEVEL: high

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Job summary
        if: always()
        run: |
          {
            echo "### Dependency audit"
            echo ""
            echo '```'
            pnpm audit --ignore-registry-errors 2>&1 | tail -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on high/critical advisories
        run: pnpm audit --audit-level="$FAIL_LEVEL" --ignore-registry-errors

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'

  auto-remediate:
    name: Auto-remediate advisories
    needs: audit
    if: >-
      always()
      && needs.audit.result == 'failure'
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write

    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/dummy
      AUTH_SECRET: dummy_auth_secret_for_ci_build_only
      GOOGLE_ID: dummy
      GOOGLE_SECRET: dummy
      SUPABASE_URL: https://dummy.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: dummy
      KUHI_API_URL: https://api.kuhi.jp
      KUHI_API_DOCS_URL: https://developers.kuhi.jp
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: dummy
      TURNSTILE_SECRET_KEY: dummy
      RESEND_API_KEY: dummy
      CONTACT_FROM_EMAIL: noreply@example.com
      CONTACT_TO_EMAIL: noreply@example.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Attempt automatic fix
        id: fix
        run: |
          pnpm audit --fix --ignore-registry-errors || true
          pnpm install --no-frozen-lockfile
          pnpm prettier --write package.json
          if git diff --quiet -- package.json pnpm-lock.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify after fix
        if: steps.fix.outputs.changed == 'true'
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test:run
          pnpm build

      - name: Open remediation pull request
        if: steps.fix.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          BRANCH="chore/security-audit-fix-$(date +%Y%m%d)"

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add package.json pnpm-lock.yaml
          git commit -m "chore(deps): apply pnpm audit --fix overrides"
          git push origin "$BRANCH"

          cat > /tmp/pr-body.md <<'BODY'
          Automated fix produced by `pnpm audit --fix`.

          format / lint / typecheck / test / build passed on this branch.

          Review the `package.json` diff before merging: `pnpm audit --fix` pins
          transitive dependencies through `pnpm.overrides` and can pull in a major
          version of a nested package.
          BODY

          gh pr create \
            --base "$TARGET_BRANCH" \
            --head "$BRANCH" \
            --title "chore(deps): automated security audit fix" \
            --body-file /tmp/pr-body.md
